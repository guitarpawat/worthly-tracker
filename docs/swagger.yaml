definitions:
  model.AssetDetail:
    properties:
      broker:
        example: SCBAM
        type: string
      defaultIncrement:
        example: "1000.00"
        type: string
      id:
        example: 1
        type: integer
      isActive:
        example: true
        type: boolean
      name:
        example: BTP
        type: string
      sequence:
        example: 1
        type: integer
      typeId:
        example: 1
        type: integer
      typeName:
        example: Mutual Fund
        type: string
    type: object
  model.AssetRecord:
    properties:
      assetId:
        example: 1
        type: integer
      boughtValue:
        example: "100.00"
        type: string
      broker:
        example: SCBAM
        type: string
      currentValue:
        example: "101.50"
        type: string
      defaultIncrement:
        example: "0.00"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: BTP
        type: string
      note:
        example: Something worth mention
        type: string
      realizedValue:
        example: "0.00"
        type: string
    type: object
  model.AssetTypeDetail:
    properties:
      id:
        example: 1
        type: integer
      isActive:
        example: true
        type: boolean
      isCash:
        example: false
        type: boolean
      isLiability:
        example: false
        type: boolean
      name:
        example: Mutual Funds
        type: string
      sequence:
        example: 1
        type: integer
    type: object
  model.AssetTypeRecord:
    properties:
      assets:
        items:
          $ref: '#/definitions/model.AssetRecord'
        type: array
      id:
        example: 1
        type: integer
      isCash:
        example: false
        type: boolean
      isLiability:
        example: false
        type: boolean
      name:
        example: Mutual Funds
        type: string
    type: object
  model.DateList:
    properties:
      current:
        description: Selected date
        format: date
        type: string
      next:
        description: Next 12 days from selected date
        items:
          format: date
          type: string
        type: array
      prev:
        description: Prev 12 days from selected date
        items:
          format: date
          type: string
        type: array
    type: object
  model.Header:
    properties:
      links:
        items:
          $ref: '#/definitions/model.TopLink'
        type: array
      title:
        type: string
    type: object
  model.Link:
    properties:
      href:
        type: string
      name:
        type: string
    type: object
  model.OffsetDetail:
    properties:
      assetId:
        example: 1
        type: integer
      effectiveDate:
        format: date
        type: string
      id:
        example: 1
        type: integer
      note:
        example: Something worth mention
        type: string
      offsetPrice:
        example: "-500.00"
        type: string
    type: object
  model.TopLink:
    properties:
      childNodes:
        items:
          $ref: '#/definitions/model.Link'
        type: array
      highlight:
        type: boolean
      href:
        type: string
      name:
        type: string
    type: object
  router.getRecordByDateResponse:
    properties:
      date:
        allOf:
        - $ref: '#/definitions/model.DateList'
        description: Date provides requested date, and 12 record date to and from
          requested date
      types:
        description: Types contains asset records group by asset types
        items:
          $ref: '#/definitions/model.AssetTypeRecord'
        type: array
    type: object
  router.postRecordRequest:
    properties:
      assets:
        description: |-
          Assets contains information about records to be added or edited
          Ignore fields: name, isCash, isLiability, assets[].name, assets[].broker, assets[].category, assets[].defaultIncrement
          Use assets[].id (update) or assets[].assetId (insert) for reference
          Update fields: assets[].assetId, assets[].boughtValue, assets[].currentValue, assets[].realizedValue, assets[].note
        items:
          $ref: '#/definitions/model.AssetRecord'
        type: array
      date:
        description: Date to be added or edited
        format: date
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Pawat Nakpiphatkul
    url: https://github.com/guitarpawat/worthly-tracker/issues
  title: Worthly Tracker
  version: "0.1"
paths:
  /api/asset:
    get:
      description: Get asset data from database filtered by is_active and type_id,
        or get all if not specified
      parameters:
      - description: Filter asset types by is_active
        in: query
        name: is_active
        type: string
      - description: Filter asset types by type_id
        in: query
        name: type_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success to get assets
          schema:
            $ref: '#/definitions/model.AssetDetail'
        "400":
          description: Input validation failed
        "404":
          description: Asset not found
        "500":
          description: Generic server error
      summary: Get assets
      tags:
      - asset_management
  /api/asset_types:
    get:
      description: Get asset types by filtered is_active, or get all asset types if
        not specified
      parameters:
      - description: Filter asset types by is_active
        in: query
        name: is_active
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AssetTypeDetail'
            type: array
        "400":
          description: Input validation failed
        "404":
          description: No any asset types found
        "500":
          description: Generic server error
      summary: Get asset types
      tags:
      - asset_management
    post:
      consumes:
      - application/json
      description: Update asset type data to database
      parameters:
      - description: Asset type data for update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AssetTypeDetail'
      produces:
      - application/json
      responses:
        "200":
          description: Success to update asset type
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Update asset type
      tags:
      - asset_management
    put:
      consumes:
      - application/json
      description: Insert new asset type to database
      parameters:
      - description: Asset type data for insert
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AssetTypeDetail'
      produces:
      - application/json
      responses:
        "200":
          description: Success to insert asset type
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Add new asset type
      tags:
      - asset_management
  /api/asset_types/{id}:
    delete:
      description: Delete asset type from database
      parameters:
      - description: Asset type id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success to delete asset type
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Delete asset type
      tags:
      - asset_management
  /api/assets:
    post:
      consumes:
      - application/json
      description: Update asset data to database
      parameters:
      - description: Asset data for update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AssetDetail'
      produces:
      - application/json
      responses:
        "200":
          description: Success to update asset
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Update asset
      tags:
      - asset_management
    put:
      consumes:
      - application/json
      description: Insert new asset to database
      parameters:
      - description: Asset data for insert
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.AssetDetail'
      produces:
      - application/json
      responses:
        "200":
          description: Success to insert asset
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Add new asset
      tags:
      - asset_management
  /api/assets/{id}:
    delete:
      description: Delete asset from database
      parameters:
      - description: Asset id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success to delete asset
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Delete asset
      tags:
      - asset_management
  /api/configs/header:
    get:
      description: Get header configuration data and determine the link to highlight
        according to current page
      produces:
      - application/json
      responses:
        "200":
          description: Success to get header config
          schema:
            $ref: '#/definitions/model.Header'
        "500":
          description: Generic server error
      summary: Get header configuration
      tags:
      - config
  /api/configs/header/{currentPage}:
    get:
      description: Get header configuration data and determine the link to highlight
        according to current page
      parameters:
      - description: Specified current page
        in: path
        name: currentPage
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success to get header config
          schema:
            $ref: '#/definitions/model.Header'
        "500":
          description: Generic server error
      summary: Get header configuration
      tags:
      - config
  /api/records/:
    get:
      description: Get records by specified date or latest available if no date supplied
      produces:
      - application/json
      responses:
        "200":
          description: Success to retrieve records
          schema:
            $ref: '#/definitions/router.getRecordByDateResponse'
        "400":
          description: Input validation failed
        "404":
          description: No any records found
        "500":
          description: Generic server error
      summary: Get records by date
      tags:
      - record
    post:
      consumes:
      - application/json
      parameters:
      - description: Records to be added or modified
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/router.postRecordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success to create/edit records
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Add or edit record of specified date
      tags:
      - record
  /api/records/{date}:
    get:
      description: Get records by specified date or latest available if no date supplied
      parameters:
      - default: ""
        description: Specified date for query in YYYY-MM-DD format
        format: date
        in: path
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success to retrieve records
          schema:
            $ref: '#/definitions/router.getRecordByDateResponse'
        "400":
          description: Input validation failed
        "404":
          description: No any records found
        "500":
          description: Generic server error
      summary: Get records by date
      tags:
      - record
  /api/records/draft:
    get:
      description: |-
        Get new draft by filter only active assets and assetTypes.
        Then prefill the data from the latest records, null if there is no data from the latest record
      produces:
      - application/json
      responses:
        "200":
          description: Get draft successfully
          schema:
            $ref: '#/definitions/model.AssetTypeRecord'
        "500":
          description: Generic server error
      summary: Get record draft for making a new record date
      tags:
      - record
  /api/records/offset/{date}:
    get:
      description: |-
        Get asset offset prices for every asset in the record.
        For every asset, get only the latest record before or on the specified date
      parameters:
      - description: Specified date for query in YYYY-MM-DD format
        format: date
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success to retrieve records
          schema:
            items:
              $ref: '#/definitions/model.OffsetDetail'
            type: array
        "400":
          description: Input validation failed
        "500":
          description: Generic server error
      summary: Get offset price for specified date
      tags:
      - record
schemes:
- http
swagger: "2.0"
